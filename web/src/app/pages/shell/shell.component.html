<div class="shell">

    @if (offline()) {
    <div class="offline-banner" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0">
            <line x1="1" y1="1" x2="23" y2="23" />
            <path
                d="M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.56 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01" />
        </svg>
        You're offline — scores save locally
    </div>
    }

    <main class="content">
        <router-outlet />
    </main>

    <nav class="nav" aria-label="Tab bar">
        <a routerLink="/app/home" routerLinkActive="active" #rlaHome="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: true }" class="nav-item"
            [attr.aria-current]="rlaHome.isActive ? 'page' : null" aria-label="Home">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12L12 4l9 8" />
                <path d="M5 10v9a1 1 0 001 1h4v-4h4v4h4a1 1 0 001-1v-9" />
            </svg>
            <span class="nav-label">Home</span>
        </a>

        <a routerLink="/app/courses" routerLinkActive="active" #rlaCourses="routerLinkActive" class="nav-item"
            [attr.aria-current]="rlaCourses.isActive ? 'page' : null" aria-label="Courses">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="9" r="3" />
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" />
            </svg>
            <span class="nav-label">Courses</span>
        </a>

        <a routerLink="/app/rounds/new" routerLinkActive="active" #rlaPlay="routerLinkActive"
            class="nav-item nav-primary" [attr.aria-current]="rlaPlay.isActive ? 'page' : null"
            aria-label="Start new round">
            <span class="nav-play">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" style="width:22px;height:22px" aria-hidden="true">
                    <line x1="8" y1="6" x2="8" y2="18" />
                    <path d="M8 7l10 5-10 5" />
                </svg>
            </span>
            <span class="nav-label">Play</span>
        </a>

        <a routerLink="/app/history" routerLinkActive="active" #rlaHistory="routerLinkActive" class="nav-item"
            [attr.aria-current]="rlaHistory.isActive ? 'page' : null" aria-label="Round history">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5" y="3" width="14" height="18" rx="2" />
                <line x1="9" y1="8" x2="15" y2="8" />
                <line x1="9" y1="12" x2="15" y2="12" />
                <line x1="9" y1="16" x2="12" y2="16" />
            </svg>
            <span class="nav-label">History</span>
        </a>

        <a routerLink="/app/trophy" routerLinkActive="active" #rlaTrophy="routerLinkActive" class="nav-item"
            [attr.aria-current]="rlaTrophy.isActive ? 'page' : null" aria-label="Trophy room">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 3h10v7a5 5 0 01-10 0V3z" />
                <path d="M7 7H4a2 2 0 000 4 3 3 0 003 3" />
                <path d="M17 7h3a2 2 0 010 4 3 3 0 01-3 3" />
                <line x1="12" y1="15" x2="12" y2="19" />
                <line x1="9" y1="19" x2="15" y2="19" />
            </svg>
            <span class="nav-label">Trophy</span>
        </a>

    </nav>

</div>
